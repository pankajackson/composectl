model_list:
  - model_name: qwen3-14b
    litellm_params:
      model: ollama_chat/qwen3:14b
      api_base: http://ollama:11434
      max_tokens: 8192

  - model_name: gpt-oss-20b
    litellm_params:
      model: ollama_chat/gpt-oss:20b
      api_base: http://ollama:11434
      max_tokens: 8192

  - model_name: starcoder-1b
    litellm_params:
      model: ollama/starcoder:1b
      api_base: http://ollama:11434
      max_tokens: 8192

  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
      max_tokens: 8192

  - model_name: groq-gpt-oss-120b
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
      max_tokens: 8192
      timeout: 300

  # Auto Router uses LiteLLM's built-in complexity classifier. It doesn't need
  # a separate classifier API key; use the tiers as the routing policy.
  - model_name: smart
    litellm_params:
      model: auto_router/complexity_router
      complexity_router_config:
        tiers:
          SIMPLE: gpt-oss-20b
          MEDIUM: gemini-2.5-flash
          COMPLEX: groq-gpt-oss-120b
          REASONING: gemini-2.5-flash
        classifier_type: heuristic
        classifier_fallback: default_model
        return_raw_model_name: true
      complexity_router_default_model: qwen3-14b

litellm_settings:
  drop_params: true
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD
    ttl: 3600
    supported_call_types:
      [
        "acompletion",
        "completion",
        "atext_completion",
        "aembedding",
        "embedding",
        "atranscription",
        "aresponses",
      ]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
