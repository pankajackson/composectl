model_list:
  # ---- Local (Ollama) ----
  - model_name: small-qwen3-4b-instruct-local
    litellm_params:
      model: ollama_chat/qwen3:4b-instruct
      api_base: http://ollama:11434
      max_tokens: 4096
      num_ctx: 8192
      keep_alive: "30m"
    model_info:
      max_input_tokens: 8192
      max_output_tokens: 4096
      max_tokens: 4096
      mode: chat
      input_cost_per_token: 0
      output_cost_per_token: 0
      # supports_function_calling: true

  - model_name: medium-qwen3-14b-local
    litellm_params:
      model: ollama_chat/qwen3:14b
      api_base: http://ollama:11434
      max_tokens: 8192
      num_ctx: 8192
      keep_alive: "30m"
    model_info:
      max_input_tokens: 8192
      max_output_tokens: 8192
      max_tokens: 8192
      mode: chat
      input_cost_per_token: 0
      output_cost_per_token: 0

  # Autocomplete (FIM). Uses the /api/generate endpoint, hence "ollama/" and not "ollama_chat/".
  # Optional: Continue can call Ollama directly instead (see below).
  - model_name: coder-starcoder-1b-local
    litellm_params:
      model: ollama/starcoder:1b
      api_base: http://ollama:11434
      max_tokens: 128 # becomes num_predict; 64-128 is plenty for FIM
      temperature: 0.1 # near-deterministic suits code completion
      top_p: 0.9
      num_ctx: 4096 # smaller KV cache, faster prompt processing
      keep_alive: -1 # never unload
      timeout: 10 # a stale suggestion is useless
      num_retries: 0 # don't retry autocomplete requests
    model_info:
      max_input_tokens: 4096
      max_output_tokens: 128
      max_tokens: 128
      mode: completion
      input_cost_per_token: 0
      output_cost_per_token: 0

  # ---- Claude Code (Local Agent) ----
  - model_name: medium-coding-gpt-oss-20b-local
    litellm_params:
      model: ollama_chat/gpt-oss:20b
      api_base: http://ollama:11434
      max_tokens: 8192
      num_ctx: 32768
      keep_alive: "30m"
      timeout: 300
    model_info:
      max_input_tokens: 32768
      max_output_tokens: 8192
      max_tokens: 8192
      mode: chat
      input_cost_per_token: 0
      output_cost_per_token: 0

  # ---- Cloud ----
  - model_name: medium-gemini-2.5-flash-cloud
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
      max_tokens: 8192

  - model_name: large-groq-gpt-oss-120b-cloud
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
      max_tokens: 8192
      timeout: 300

  # ---- Classifire Model ---
  - model_name: small-gemma4-e2b-local
    litellm_params:
      model: ollama_chat/gemma4:e2b
      api_base: http://ollama:11434

  # ---- Auto router ----
  - model_name: smart
    litellm_params:
      model: auto_router/complexity_router
      complexity_router_config:
        tiers:
          SIMPLE: small-qwen3-4b-instruct-local
          MEDIUM: medium-qwen3-14b-local
          COMPLEX: medium-gemini-2.5-flash-cloud
          REASONING: large-groq-gpt-oss-120b-cloud
        classifier_type: llm

        classifier_llm_config:
          model: small-gemma4-e2b-local
          timeout_ms: 5000

        classifier_fallback: heuristic
        session_affinity: false
        return_raw_model_name: true

      complexity_router_default_model: small-qwen3-4b-instruct-local

router_settings:
  num_retries: 2
  timeout: 120
  fallbacks:
    - large-groq-gpt-oss-120b-cloud: [medium-gemini-2.5-flash-cloud]
    - medium-gemini-2.5-flash-cloud: [medium-qwen3-14b-local]
    - medium-qwen3-14b-local: [small-qwen3-4b-instruct-local]

litellm_settings:
  drop_params: true
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD
    ttl: 3600
    supported_call_types:
      [
        "acompletion",
        "completion",
        "atext_completion",
        "aembedding",
        "embedding",
        "atranscription",
        "aresponses",
      ]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
