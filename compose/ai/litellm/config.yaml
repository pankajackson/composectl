# Aliases you call from clients:
#   local        -> Ollama on your GPU (falls back to "smart" on error / overload / long context)
#   smart        -> free cloud pool, tried in priority order (order 1 first), falls back to local
#   gemini-flash, groq-gpt-oss-120b -> pick one provider directly
#   local-embed  -> embeddings (Ollama)
# Edit model names to match what is currently free on each provider.

model_list:
  # ------------------------------ LOCAL ------------------------------------
  - model_name: local
    litellm_params:
      model: ollama_chat/qwen3:14b # fits 16 GB; use qwen3:8b on 8 GB
      api_base: http://ollama:11434

  - model_name: local-embed
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://ollama:11434

  # ------------------------- DIRECT CLOUD ALIASES --------------------------
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: groq-gpt-oss-120b
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY

  # ------------------------ "smart" = ordered cloud pool -------------------
  - model_name: smart
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
      order: 1
  - model_name: smart
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
      order: 2
  - model_name: smart
    litellm_params:
      model: cerebras/gpt-oss-120b
      api_key: os.environ/CEREBRAS_API_KEY
      order: 3
  - model_name: smart
    litellm_params:
      model: openrouter/meta-llama/llama-3.3-70b-instruct:free
      api_key: os.environ/OPENROUTER_API_KEY
      order: 4
  - model_name: smart
    litellm_params:
      model: mistral/mistral-small-latest
      api_key: os.environ/MISTRAL_API_KEY
      order: 5

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 1
  timeout: 90
  allowed_fails: 2 # rate-limited provider is skipped for cooldown_time
  cooldown_time: 60
  fallbacks:
    - local: ["smart"]
    - smart: ["local"]
    - gemini-flash: ["smart"]
    - groq-gpt-oss-120b: ["smart"]
  context_window_fallbacks:
    - local: ["smart"]

litellm_settings:
  drop_params: true
  # Greeting short-circuit + "never cache tool calls" (see greeting_hook.py)
  callbacks: greeting_hook.proxy_handler_instance
  # Exact-match cache. Clients can bypass it per request with: "cache": {"no-cache": true}
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD
    ttl: 3600
    supported_call_types:
      ["acompletion", "completion", "aembedding", "embedding"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
