services:
  arcane:
    image: ghcr.io/getarcaneapp/manager:latest
    container_name: arcane
    ports:
      - "3552:3552"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/storage/arcane/data:/app/data
      - /opt/storage/arcane/docker:/opt/docker
    environment:
      - APP_URL=http://localhost:3552
      - PUID=0
      - PGID=0
      - ENCRYPTION_KEY=bFYyiPd6EAeHEwzjnRX33NXqZDjW24AmuZasoV0Llwk=
      - PROJECTS_DIRECTORY=/opt/docker
    cgroup: host
    restart: unless-stopped
    networks:
      - secure-network

networks:
  secure-network:
    external: true
    name: ${CONTAINER_NETWORK}
