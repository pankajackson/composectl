# Call `smart` for automatic complexity routing, or call any named model directly.
# Adjust the four tiers below to change which kind of request uses each provider.
model_list:
  - model_name: local-chat
    litellm_params:
      model: ollama_chat/qwen3:8b
      api_base: os.environ/OLLAMA_API_BASE

  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: groq-llama
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY

  # Auto Router uses LiteLLM's built-in complexity classifier. It doesn't need
  # a separate classifier API key; use the tiers as the routing policy.
  - model_name: smart
    litellm_params:
      model: auto_router/complexity_router
      complexity_router_config:
        tiers:
          SIMPLE: local-chat
          MEDIUM: gemini-flash
          COMPLEX: groq-llama
          REASONING: gemini-flash
        classifier_type: heuristic
        classifier_fallback: default_model
      complexity_router_default_model: local-chat

litellm_settings:
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
