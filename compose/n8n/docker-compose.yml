x-n8n: &service-n8n
  image: n8nio/n8n:stable
  networks:
    - secure-network
  environment:
    DB_TYPE: postgresdb
    DB_POSTGRESDB_HOST: postgres
    DB_POSTGRESDB_USER: ${POSTGRES_USER}
    DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
    N8N_DIAGNOSTICS_ENABLED: "false"
    N8N_PERSONALIZATION_ENABLED: "false"
    N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
    N8N_USER_MANAGEMENT_JWT_SECRET: ${N8N_USER_MANAGEMENT_JWT_SECRET}
    OLLAMA_HOST: ${OLLAMA_HOST}
  env_file:
    - path: .env
      required: true

services:
  postgres:
    image: postgres:16-alpine
    hostname: postgres
    container_name: n8n-postgres
    networks:
      - secure-network
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - /opt/storage/n8n/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    mem_reservation: 256m
    cpus: "1.0"
    pids_limit: 200

  n8n-import:
    <<: *service-n8n
    hostname: n8n-import
    container_name: n8n-import
    entrypoint: /bin/sh
    command:
      - "-c"
      - |
        if [ -z "$(n8n list:workflow --onlyId)" ]; then
          n8n import:credentials --separate --input=/demo-data/credentials && \
          n8n import:workflow --separate --input=/demo-data/workflows
        else
          echo "Workflows exist, skipping import"
        fi
    volumes:
      - ./n8n/demo-data:/demo-data
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    mem_reservation: 64m
    cpus: "0.50"
    pids_limit: 100

  n8n:
    <<: *service-n8n
    hostname: n8n
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_RUNNERS_ENABLED: "true"
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
    volumes:
      - ./n8n/demo-data:/demo-data
      - /opt/storage/n8n/data/n8n:/home/node/.n8n
      - /opt/storage/n8n/data/shared:/data/shared
    depends_on:
      postgres:
        condition: service_healthy
      n8n-import:
        condition: service_completed_successfully
    mem_limit: 1g
    mem_reservation: 512m
    cpus: "1.5"
    pids_limit: 512

  task-runners:
    build:
      context: ./runner
      dockerfile: Dockerfile
      args:
        N8N_RUNNERS_PYTHON_PACKAGES: ${N8N_RUNNERS_PYTHON_PACKAGES}
        N8N_RUNNERS_NODE_PACKAGES: ${N8N_RUNNERS_NODE_PACKAGES}

        N8N_RUNNERS_STDLIB_ALLOW: ${N8N_RUNNERS_STDLIB_ALLOW}
        N8N_RUNNERS_EXTERNAL_ALLOW: ${N8N_RUNNERS_EXTERNAL_ALLOW}

        N8N_RUNNERS_NODE_BUILTIN_ALLOW: ${N8N_RUNNERS_NODE_BUILTIN_ALLOW}
        N8N_RUNNERS_NODE_EXTERNAL_ALLOW: ${N8N_RUNNERS_NODE_EXTERNAL_ALLOW}
    image: n8nio/runners:lxa
    hostname: n8n-runners
    container_name: n8n-runners
    networks:
      - secure-network
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
    depends_on:
      n8n:
        condition: service_started
    mem_limit: 512m
    mem_reservation: 256m
    cpus: "1.0"
    pids_limit: 256

  shell-executor:
    build:
      context: ./shell-executor
      dockerfile: Dockerfile
    hostname: shell-executor
    container_name: shell-executor
    networks:
      - secure-network
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - SYS_CHROOT
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./shell-executor/authorized_keys:/home/n8n-runner/.ssh/authorized_keys.ro:ro
      - ./shell-executor/keys/executor_key:/run/secrets/executor_key.ro:ro
      - ./shell-executor/allowed-commands.txt:/etc/shell-executor/allowed-commands.txt:ro
      - /opt/storage/n8n/data/shell-executor/host-keys:/etc/ssh-host-keys
      - /opt/storage/n8n/data/shared:/data/shared:ro
    depends_on:
      n8n:
        condition: service_started
    mem_limit: 256m
    mem_reservation: 128m
    cpus: "0.50"
    pids_limit: 64

